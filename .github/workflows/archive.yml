name: Archive official firmware

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只抓取并生成正文预览（写入运行摘要和 1 天 artifact），不发布 Release、不推送仓库'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: official-firmware-archive
  cancel-in-progress: false

jobs:
  download:
    if: github.repository == 'LOVECHEN/nuphy-firmware' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.actor == 'LOVECHEN')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: write
    steps:
      - name: Randomize scheduled checks
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(shuf -i 0-1800 -n 1)
          printf 'Scheduled jitter: %s seconds\n' "$DELAY"
          sleep "$DELAY"
      - name: Checkout reviewed downloader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify official firmware directly on runner
        env:
          NUPHY_UPSTREAM_CONFIG: ${{ secrets.NUPHY_UPSTREAM_CONFIG }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/archive.py download --output "$RUNNER_TEMP/nuphy-official"
      - name: Publish official originals only to Releases
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/archive.py publish --output "$RUNNER_TEMP/nuphy-official"
      - name: Preview release notes without publishing (dry run)
        if: ${{ inputs.dry_run }}
        run: python3 -B .github/scripts/archive.py preview --output "$RUNNER_TEMP/nuphy-official" --preview "$RUNNER_TEMP/nuphy-preview"
      - name: Upload dry-run preview (notes and README only, no firmware)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dry-run-preview
          path: ${{ runner.temp }}/nuphy-preview
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner temporary downloads
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/nuphy-official" "$RUNNER_TEMP/nuphy-preview"
      - name: Maintain one-commit archive snapshot
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -B .github/scripts/maintenance.py compact
      - name: Keep only the latest Actions record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/maintenance.py prune
